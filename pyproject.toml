[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meanvc2-desktop"
version = "1.0.0"
description = "Native Windows streaming MeanVC2 voice conversion"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1", "torchaudio==2.5.1", "numpy==1.26.4",
  "PySide6==6.8.3", "sounddevice==0.5.1", "soundfile==0.13.1",
  "soxr==0.5.0.post1", "huggingface-hub==0.36.0", "safetensors==0.5.3",
  "einops==0.8.0", "x-transformers==2.2.11",
]

[project.optional-dependencies]
build = ["pyinstaller==6.16.0"]

[project.gui-scripts]
meanvc2-desktop = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["assets/*.pt"]
"app.vendor" = ["*.json", "*.md", "LICENSE*"]
